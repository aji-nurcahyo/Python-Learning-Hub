    <title>Halaman Tidak Ditemukan — Python Learning Hub</title>
    <script>
      // Single-Page Application (SPA) redirect handler for GitHub Pages & static hosting
      (function() {
        var l = window.location;
        var path = l.pathname;
        if (path.endsWith('/404.html') || path.endsWith('/404')) {
          return;
        }

        var segments = path.split('/').filter(Boolean);
        var isGitHubPages = l.hostname.endsWith('github.io');
        var repoName = 'python-learning-hub';
        var hasRepoPrefix = segments.length > 0 && segments[0] === repoName;
        
        var base = (isGitHubPages || hasRepoPrefix) ? '/' + (hasRepoPrefix ? segments[0] : repoName) + '/' : '/';
        var routeSegments = hasRepoPrefix ? segments.slice(1) : segments;
        var route = routeSegments.join('/');

        // Backward compatibility mapping for old pertemuan-XX URLs
        if (route.startsWith('pertemuan-')) {
          var isReading = l.search.indexOf('view=read') !== -1;
          var isTask = route.indexOf('tugas.html') !== -1;
          
          if (route.indexOf('pertemuan-09') !== -1) {
            var targetView = isReading ? '/read' : (isTask ? '/task' : '/slides');
            l.replace(base + '#chapter/10' + targetView);
            return;
          }
          if (route.indexOf('pertemuan-10') !== -1) {
            var targetView10 = isReading ? '/read' : (isTask ? '/task' : '/slides');
            l.replace(base + '#chapter/08' + targetView10);
            return;
          }
          var matchNum = /pertemuan-(\d+)/.exec(route);
          if (matchNum) {
            var n = parseInt(matchNum[1], 10);
            l.replace(base + '#chapter/' + n);
            return;
          }
        }

        // Generic SPA redirect to hash route
        if (route) {
          var target = base + (l.search || '') + '#' + route;
          l.replace(target);
        } else if (hasRepoPrefix && !path.endsWith('/')) {
          l.replace(base + (l.search || '') + (l.hash || ''));
        }
      })();
    </script>
